name: Build PyGit Setup EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build setup.exe
        run: >
          pyinstaller
          --clean
          --noconfirm
          --onefile
          --windowed
          --name PyGit
          setup.py

      - name: Upload setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: PyGit-Setup
          path: dist/PyGit.exe
          if-no-files-found: error
