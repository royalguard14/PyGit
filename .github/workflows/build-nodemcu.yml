name: Build NodeMCU Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'nodemcu/node_github_test.ino'
      - '.github/workflows/build-nodemcu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compile deployable NodeMCU firmware
        run: |
          mkdir -p build/sketch
          cp nodemcu/node_github_test.ino build/sketch/nodemcu.ino

          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir build \
            build/sketch

      - name: Sync firmware version and publish firmware.bin
        run: |
          python3 - <<'PY'
          import json
          import re

          source = open("nodemcu/node_github_test.ino", "r", encoding="utf-8").read()
          match = re.search(r'LOCAL_FIRMWARE_VERSION\s*=\s*"([^"]+)"', source)

          if not match:
              raise SystemExit("LOCAL_FIRMWARE_VERSION not found in node_github_test.ino")

          version = match.group(1)

          with open("nodemcu/data/config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          config.setdefault("general_version", {})
          config["general_version"]["ino"] = version

          with open("nodemcu/data/config.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")

          print("General firmware version:", version)
          PY

          cp build/nodemcu.ino.bin nodemcu/firmware.bin

          git config user.name "PyGit Build Bot"
          git config user.email "actions@github.com"

          git add nodemcu/firmware.bin nodemcu/data/config.json
          git diff --cached --quiet && exit 0
          git commit -m "Build NodeMCU firmware"
          git push
