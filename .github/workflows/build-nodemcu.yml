name: Build NodeMCU Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'nodemcu/node_pygit.ino'
      - 'nodemcu/node_pygit_update.ino'
      - '.github/workflows/build-nodemcu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compile deployable NodeMCU firmware
        run: |
          mkdir -p build/sketch
          cp nodemcu/node_pygit.ino build/sketch/sketch.ino
          cp nodemcu/node_pygit_update.ino build/sketch/node_pygit_update.ino

          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir build \
            build/sketch

      - name: Publish firmware and identities
        run: |
          cp build/sketch.ino.bin nodemcu/firmware.bin

          md5sum nodemcu/firmware.bin | awk '{print $1}' > nodemcu/firmware.md5
          sha256sum nodemcu/firmware.bin | awk '{print $1}' > nodemcu/firmware.sha256

          git config user.name "PyGit Build Bot"
          git config user.email "actions@github.com"

          git add nodemcu/firmware.bin nodemcu/firmware.md5 nodemcu/firmware.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Build NodeMCU PyGit firmware"
          git push
