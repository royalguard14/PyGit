name: Build NodeMCU Firmware

on:
  push:
    branches:
      - main
    paths:
      - 'nodemcu/node_pygit.ino'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

      - name: Compile NodeMCU firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir build \
            nodemcu/node_pygit.ino

      - name: Publish firmware.bin
        run: |
          cp build/node_pygit.ino.bin nodemcu/firmware.bin

          git config user.name "PyGit Build Bot"
          git config user.email "actions@github.com"

          git add nodemcu/firmware.bin
          git diff --cached --quiet && exit 0
          git commit -m "Build NodeMCU firmware"
          git push
